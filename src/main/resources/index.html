<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body { height: 100%; margin: 0; }
      #stage {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #111;
        touch-action: none; /* helps avoid browser gestures interfering */
        cursor: grab;
      }
      #stage.dragging { cursor: grabbing; }

      #screenshot {
        width: 100%;
        height: auto;
        display: block;
        transform-origin: 0 0;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div style="padding: 8px; color: #ddd; font-family: sans-serif;">
      Spyware web service is running. Try GET <a href="/screenshot">/screenshot</a> to get a JPEG screenshot.
      (Wheel to zoom, drag to pan.)
      <br/>
      Screenshot Refresh Speed: <span id="refresh-interval">5</span> seconds
      <button id="increase-speed">-1s (Faster)</button>
      <button id="decrease-speed">+1s (Slower)</button>
    </div>

    <div id="stage">
      <img src="/screenshot" id="screenshot" alt="screenshot"/>
    </div>

    <script>
      const img = document.getElementById('screenshot');
      const stage = document.getElementById('stage');
      const intervalDisplay = document.getElementById('refresh-interval');
      const increaseBtn = document.getElementById('increase-speed');
      const decreaseBtn = document.getElementById('decrease-speed');

      let refreshIntervalSeconds = 5;
      let refreshTimer;

      function startRefresh() {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(function() {
          const params = new URLSearchParams(window.location.search);
          params.set('rand', Math.random());
          img.src = '/screenshot?' + params.toString();
        }, refreshIntervalSeconds * 1000);
      }

      increaseBtn.addEventListener('click', () => {
        if (refreshIntervalSeconds > 1) {
          refreshIntervalSeconds--;
          intervalDisplay.textContent = refreshIntervalSeconds;
          startRefresh();
        }
      });

      decreaseBtn.addEventListener('click', () => {
        refreshIntervalSeconds++;
        intervalDisplay.textContent = refreshIntervalSeconds;
        startRefresh();
      });

      startRefresh();

      let scale = 1;
      let tx = 0, ty = 0;

      function applyTransform() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      }
      applyTransform();

      // Zoom with wheel, keeping the point under the cursor stable.
      stage.addEventListener('wheel', (e) => {
        e.preventDefault();

        const rect = stage.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;

        const oldScale = scale;
        const zoomFactor = Math.exp(-e.deltaY * 0.0015); // smooth zoom
        scale = Math.min(8, Math.max(1, scale * zoomFactor));

        // Adjust translation so (cx,cy) stays anchored
        tx = cx - (cx - tx) * (scale / oldScale);
        ty = cy - (cy - ty) * (scale / oldScale);

        applyTransform();
      }, { passive: false });

      // Pan by dragging
      let dragging = false;
      let lastX = 0, lastY = 0;

      stage.addEventListener('mousedown', (e) => {
        dragging = true;
        stage.classList.add('dragging');
        lastX = e.clientX;
        lastY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        tx += (e.clientX - lastX);
        ty += (e.clientY - lastY);
        lastX = e.clientX;
        lastY = e.clientY;
        applyTransform();
      });

      window.addEventListener('mouseup', () => {
        dragging = false;
        stage.classList.remove('dragging');
      });

    </script>
  </body>
</html>
